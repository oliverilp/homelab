apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: volume-snapshots
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# The job talks to nothing but CoreDNS and the API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: volume-snapshots
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# CiliumNetworkPolicy because the API server runs on host network and Cilium DNATs
# the ClusterIP to node IPs before egress policy is evaluated — same reason as
# k8s/postgresql-clusters/postgres-egress-networkpolicy.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: volume-snapshots
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

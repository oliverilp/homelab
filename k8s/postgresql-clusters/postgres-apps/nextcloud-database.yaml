apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: nextcloud-database
  namespace: postgresql
spec:
  cluster:
    name: postgres-apps
  name: nextclouddb
  owner: nextcloud
  databaseReclaimPolicy: retain
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-apps-nextcloud-auth-es
  namespace: postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: postgres-apps-nextcloud-auth
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: "6818a167-bf3c-49a3-b4f3-b44c00af6f82"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: password
      remoteRef:
        key: "d9ae58e9-0eb2-4bbb-a152-b44c00afaa77"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore

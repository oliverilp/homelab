name: gatus-monitoring

services:
  gatus:
    image: ghcr.io/twin/gatus:stable
    restart: unless-stopped
    environment:
      GATUS_CONFIG_PATH: /config
      GATUS_LOG_LEVEL: ${GATUS_LOG_LEVEL:-INFO}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "127.0.0.1:${GATUS_PORT:-8080}:8080"
    volumes:
      - ./config:/config:ro
      - ./data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - gatus
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Tallinn}
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    command:
      - --label-enable
      - --cleanup
      - --schedule
      - ${WATCHTOWER_SCHEDULE:-0 0 4 * * 0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

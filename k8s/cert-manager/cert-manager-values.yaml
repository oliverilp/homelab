crds:
  enabled: true

resources:
  requests:
    cpu: 10m
    memory: 120Mi
  limits:
    memory: 120Mi

webhook:
  timeoutSeconds: 30
  serviceType: ClusterIP
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 130Mi
    limits:
      memory: 130Mi

startupapicheck:
  enabled: true
  timeout: 5m
  backoffLimit: 4

global:
  logLevel: 2
  
  leaderElection:
    namespace: cert-manager

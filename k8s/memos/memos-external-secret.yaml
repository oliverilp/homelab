apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-postgres-auth-es
  namespace: memos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: memos-postgres-auth
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: dsn
      remoteRef:
        key: "c8dbdf8e-1f76-4dfa-9d05-b31800b33705"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch

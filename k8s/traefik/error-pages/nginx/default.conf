server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 204;
    }

    location ~ ^/[0-9]{3}\.html$ {
        try_files $uri =404;
    }

    location / {
        error_page 404 /404.html;
        return 404;
    }
}

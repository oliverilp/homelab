apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traefik

resources:
  - deployment.yaml
  - service.yaml
  - middleware.yaml
  - httproute.yaml

configMapGenerator:
  - name: traefik-error-pages-html
    files:
      # Only gateway-level pages are served now (see middleware.yaml). 404 is
      # kept as nginx's internal fallback for unexpected requests.
      - html/404.html
      - html/502.html
      - html/503.html
      - html/504.html
  - name: traefik-error-pages-nginx
    files:
      - default.conf=nginx/default.conf

generatorOptions:
  labels:
    app.kubernetes.io/name: traefik-error-pages
    app.kubernetes.io/component: error-pages
    app.kubernetes.io/part-of: traefik

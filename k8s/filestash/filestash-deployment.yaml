apiVersion: apps/v1
kind: Deployment
metadata:
  name: filestash
  namespace: filestash
  labels:
    app: filestash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filestash
  template:
    metadata:
      labels:
        app: filestash
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-directories
          image: busybox:1.37
          command:
            [
              "sh",
              "-c",
              "mkdir -p /app/data/state/log && chmod -R 775 /app/data/state",
            ]
          volumeMounts:
            - name: filestash-data
              mountPath: /app/data/state
      containers:
        - name: filestash
          image: machines/filestash@sha256:3780c7384c8f2054f88906dce46f3cbd475e92344cd7806118f4bc9c52f10336
          ports:
            - containerPort: 8334
              name: http
          env:
            - name: APPLICATION_URL
              value: "files.oliverilp.ee"
            - name: CANARY
              value: "true"
          resources:
            requests:
              cpu: 20m
              memory: 350Mi
            limits:
              memory: 350Mi
          volumeMounts:
            - name: filestash-data
              mountPath: /app/data/state
      volumes:
        - name: filestash-data
          persistentVolumeClaim:
            claimName: filestash-data-pvc

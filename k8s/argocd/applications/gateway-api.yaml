# Gateway API CRDs (standard channel)
# Installed via GitOps instead of manual kubectl apply (see BOOTSTRAP.MD).
# TLSRoute graduated to the standard channel in Gateway API v1.5.0, which
# Traefik v3.7+ (chart v40) requires; without it the gateway provider's
# informer cache fails to sync and Traefik serves its default certificate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Foundational CRDs must exist before Traefik (-5) and any Gateway/HTTPRoute.
    argocd.argoproj.io/sync-wave: "-35"
spec:
  project: default
  source:
    repoURL: "git@github.com:oliverilp/homelab.git"
    path: k8s/gateway-api
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      # Gateway API CRD schemas exceed kubectl's 262 KB client-side-apply
      # annotation limit; server-side apply is required.
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

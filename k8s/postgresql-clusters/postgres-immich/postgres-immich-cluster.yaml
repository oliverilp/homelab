apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-immich
  namespace: postgresql
spec:
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.5-0.4.3@sha256:acebb38ca309938bc05ce268b019c98aa718cb554dd54e4443654d9d00a0d498
  instances: 3

  managed:
    roles:
      - name: immich
        ensure: present
        comment: "Immich application user"
        login: true
        superuser: true
        createdb: false
        createrole: false
        passwordSecret:
          name: postgres-immich-auth

  bootstrap:
    initdb:
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;

  postgresql:
    shared_preload_libraries:
      - "vchord.so"

  superuserSecret:
    name: postgres-immich-superuser-auth

  storage:
    size: 10Gi
    storageClass: nfs-app-data

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
    podAntiAffinityType: preferred
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-immich-superuser-auth-es
  namespace: postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: postgres-immich-superuser-auth
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: "112fd54f-68ca-4ae7-9f74-b31800d1b531"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
    - secretKey: password
      remoteRef:
        key: "a0645cd2-1926-4859-a6f0-b31800d1def6"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch

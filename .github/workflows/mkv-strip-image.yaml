name: Build mkv-strip image

on:
  push:
    branches:
      - main
    paths:
      - jobs/mkv-strip/**
      - .github/workflows/mkv-strip-image.yaml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: mkv-strip-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mkv-strip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image reference
        id: image
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          image_ref="${IMAGE_NAME}:sha-${short_sha}"
          echo "tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "ref=${image_ref}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: jobs/mkv-strip
          file: jobs/mkv-strip/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Kubernetes image references
        uses: mikefarah/yq@v4
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        with:
          cmd: |
            yq -i '(.spec.jobTemplate.spec.template.spec.containers[] | select(.name == "mkv-strip").image) = strenv(IMAGE_REF)' k8s/mkv-strip/mkv-strip-cronjob.yaml
            yq -i '(.spec.template.spec.containers[] | select(.name == "mkv-strip").image) = strenv(IMAGE_REF)' k8s/mkv-strip/mkv-strip-job.yaml

      - name: Commit manifest update
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        shell: bash
        run: |
          if git diff --quiet -- k8s/mkv-strip/mkv-strip-cronjob.yaml k8s/mkv-strip/mkv-strip-job.yaml; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/mkv-strip/mkv-strip-cronjob.yaml k8s/mkv-strip/mkv-strip-job.yaml
          git commit -m "chore(mkv-strip): update image to ${IMAGE_REF##*:}"
          git push

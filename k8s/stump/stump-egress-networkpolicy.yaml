---
# Default deny all egress traffic from the Stump namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: stump
spec:
  podSelector: {}
  policyTypes:
    - Egress

---
# Allow same-namespace traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-egress
  namespace: stump
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}

---
# Allow direct DNS to Cloudflare and Google public resolvers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-dns-egress
  namespace: stump
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 1.1.1.1/32
        - ipBlock:
            cidr: 1.0.0.1/32
        - ipBlock:
            cidr: 8.8.8.8/32
        - ipBlock:
            cidr: 8.8.4.4/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Allow and observe DNS lookups needed by Cilium FQDN egress policies.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cilium-dns-egress
  namespace: stump
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"

---
# Allow OIDC discovery against the public Authentik hostname.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-authentik-fqdn-egress
  namespace: stump
spec:
  endpointSelector: {}
  egress:
    - toFQDNs:
        - matchName: auth.oliverilp.ee
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

---
# Allow OIDC login flow to Authentik.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-authentik-egress
  namespace: stump
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik

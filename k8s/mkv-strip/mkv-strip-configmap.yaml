apiVersion: v1
kind: ConfigMap
metadata:
  name: mkv-strip-config
  namespace: mkv-strip
data:
  config.json: |
    {
      "directories": [
        "/media/la-movies",
        "/media/la-tv"
      ],
      "remove_languages": [
        "rus",
        "ukr"
      ],
      "recursive": true,
      "keep_going": true,
      "in_place": true,
      "dry_run": false,
      "fail_on_file_errors": true,
      "min_output_size_ratio": 0.3
    }


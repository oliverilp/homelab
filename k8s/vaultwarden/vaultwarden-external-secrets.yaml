apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-postgres-auth-es
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: vaultwarden-postgres-auth
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        database-url: "postgresql://{{ .username }}:{{ .password }}@postgres-apps-rw.postgresql.svc.cluster.local:5432/vaultwardendb"
  data:
    - secretKey: username
      remoteRef:
        key: "7ba7efd4-ca26-4fc9-8297-b32c00d61136"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
    - secretKey: password
      remoteRef:
        key: "5078cc86-b9a5-40b0-a728-b32c00d63d93"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-app-secrets-es
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: vaultwarden-app-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: admin-token
      remoteRef:
        key: "4070937d-dda1-47ee-9a93-b32c00db35a9"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch

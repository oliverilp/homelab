# Tiered CSI snapshots of every Ceph-backed PVC (daily/weekly/monthly + pruning).
# See k8s/volume-snapshots/README.md for selection rules and the restore runbook.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: volume-snapshots
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Last: the CronJobs discover PVCs at runtime, so every app should exist first.
    argocd.argoproj.io/sync-wave: "35"
spec:
  project: default
  source:
    repoURL: "git@github.com:oliverilp/homelab.git"
    path: k8s/volume-snapshots
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: volume-snapshots
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

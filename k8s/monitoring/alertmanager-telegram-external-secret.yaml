apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram-config-es
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: "null"
            group_by:
              - namespace
            routes:
              - receiver: "null"
                matchers:
                  - alertname = "Watchdog"
              - receiver: telegram
                matchers:
                  - alertname = "HomelabServiceDown"
                group_by:
                  - alertname
                  - service
                  - instance
                group_wait: 0s
                group_interval: 5m
                repeat_interval: 12h
              - receiver: telegram-argocd
                matchers:
                  - alertname =~ "ArgoCDAppOutOfSync|ArgoCDAppUnhealthy|ArgoCDAppSyncFailed"
                group_by:
                  - alertname
                  - name
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 12h
              # Every rule in the Rook `prometheus-ceph-rules` PrometheusRule
              # carries type=ceph_default, so this one matcher catches them all
              # (health, OSD/mon/PG, pool capacity, mgr/exporter down, hardware).
              - receiver: telegram-ceph
                matchers:
                  - type = "ceph_default"
                group_by:
                  - alertname
                  - severity
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 12h
              # Every CloudNativePG alert is CNPG*-prefixed (see cnpg-alert-rules.yaml),
              # so one alertname regex catches the whole family — instance down,
              # replication, WAL archiving, and workload. Grouped by cluster+pod so a
              # single instance's alerts batch together.
              - receiver: telegram-cnpg
                matchers:
                  - alertname =~ "CNPG.*"
                group_by:
                  - alertname
                  - cluster
                  - pod
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 12h
              # Talos node memory alerts (talos-node-alert-rules.yaml), all
              # Talos*-prefixed. Grouped by node so the warning and the critical
              # for the same node batch into one message; kube_node_status_condition
              # labels the node `node` while node_exporter uses `kubernetes_node`,
              # hence both keys.
              - receiver: telegram-node
                matchers:
                  - alertname =~ "Talos.*"
                group_by:
                  - alertname
                  - kubernetes_node
                  - node
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 12h
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
          inhibit_rules:
            # The critical memory thresholds sit above the warning ones, so both
            # fire on a node that is genuinely full. Different alertnames mean
            # the generic severity inhibitions below (which match on alertname)
            # don't apply — silence the warning explicitly, per node.
            - source_matchers:
                - alertname = TalosControlPlaneMemoryCritical
              target_matchers:
                - alertname = TalosControlPlaneMemoryHigh
              equal:
                - kubernetes_node
            - source_matchers:
                - alertname = TalosWorkerMemoryCritical
              target_matchers:
                - alertname = TalosWorkerMemoryHigh
              equal:
                - kubernetes_node
            - source_matchers:
                - alertname = TalosNodeEphemeralDiskCritical
              target_matchers:
                - alertname =~ "TalosNodeEphemeralDisk(High|FillingUp)"
              equal:
                - kubernetes_node
            - target_matchers:
                - severity =~ warning|info
              source_matchers:
                - severity = critical
              equal:
                - namespace
                - alertname
            - target_matchers:
                - severity = info
              source_matchers:
                - severity = warning
              equal:
                - namespace
                - alertname
            - target_matchers:
                - severity = info
              source_matchers:
                - alertname = InfoInhibitor
              equal:
                - namespace
            - target_matchers:
                - alertname = InfoInhibitor
          receivers:
            - name: "null"
            - name: telegram
              telegram_configs:
                - bot_token: '{{ index . "telegram-bot-token" }}'
                  chat_id: {{ index . "telegram-chat-id" }}
                  parse_mode: HTML
                  send_resolved: true
                  message: '{{ "{{" }} template "telegram.homelab.message" . {{ "}}" }}'
            - name: telegram-argocd
              telegram_configs:
                - bot_token: '{{ index . "telegram-bot-token" }}'
                  chat_id: {{ index . "telegram-chat-id" }}
                  parse_mode: HTML
                  send_resolved: true
                  message: '{{ "{{" }} template "telegram.argocd.message" . {{ "}}" }}'
            - name: telegram-ceph
              telegram_configs:
                - bot_token: '{{ index . "telegram-bot-token" }}'
                  chat_id: {{ index . "telegram-chat-id" }}
                  parse_mode: HTML
                  send_resolved: true
                  message: '{{ "{{" }} template "telegram.ceph.message" . {{ "}}" }}'
            - name: telegram-cnpg
              telegram_configs:
                - bot_token: '{{ index . "telegram-bot-token" }}'
                  chat_id: {{ index . "telegram-chat-id" }}
                  parse_mode: HTML
                  send_resolved: true
                  message: '{{ "{{" }} template "telegram.cnpg.message" . {{ "}}" }}'
            - name: telegram-node
              telegram_configs:
                - bot_token: '{{ index . "telegram-bot-token" }}'
                  chat_id: {{ index . "telegram-chat-id" }}
                  parse_mode: HTML
                  send_resolved: true
                  message: '{{ "{{" }} template "telegram.node.message" . {{ "}}" }}'
          templates:
            - /etc/alertmanager/config/*.tmpl
        telegram.tmpl: |
          {{ "{{" }} define "telegram.homelab.message" {{ "}}" }}
          {{ "{{" }} range .Alerts {{ "}}" }}
          {{ "{{" }} if eq .Status "firing" {{ "}}" }}🚨 <b>DOWN {{ "{{" }} .Labels.service {{ "}}" }}</b> 🚨
          {{ "{{" }} .Labels.instance {{ "}}" }} failed three consecutive 1-minute HTTP probes.
          {{ "{{" }} else {{ "}}" }}✅ <b>RESOLVED {{ "{{" }} .Labels.service {{ "}}" }}</b> ✅
          {{ "{{" }} .Labels.instance {{ "}}" }} is responding again.
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} define "telegram.argocd.message" {{ "}}" }}
          {{ "{{" }} range .Alerts {{ "}}" }}
          {{ "{{" }} if eq .Status "firing" {{ "}}" }}⚠️ <b>ArgoCD: {{ "{{" }} .Labels.name {{ "}}" }}</b>
          {{ "{{" }} .Annotations.summary {{ "}}" }}
          {{ "{{" }} .Annotations.description {{ "}}" }}
          {{ "{{" }} else {{ "}}" }}✅ <b>ArgoCD OK: {{ "{{" }} .Labels.name {{ "}}" }}</b>
          {{ "{{" }} .Annotations.summary {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} define "telegram.ceph.message" {{ "}}" }}
          {{ "{{" }} range .Alerts {{ "}}" }}
          {{ "{{" }} if eq .Status "firing" {{ "}}" }}{{ "{{" }} if eq .Labels.severity "critical" {{ "}}" }}🚨{{ "{{" }} else {{ "}}" }}⚠️{{ "{{" }} end {{ "}}" }} <b>Ceph {{ "{{" }} .Labels.severity {{ "}}" }}: {{ "{{" }} .Labels.alertname {{ "}}" }}</b>
          {{ "{{" }} .Annotations.summary {{ "}}" }}
          {{ "{{" }} .Annotations.description {{ "}}" }}
          {{ "{{" }} else {{ "}}" }}✅ <b>Ceph resolved: {{ "{{" }} .Labels.alertname {{ "}}" }}</b>
          {{ "{{" }} .Annotations.summary {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} define "telegram.cnpg.message" {{ "}}" }}
          {{ "{{" }} range .Alerts {{ "}}" }}
          {{ "{{" }} if eq .Status "firing" {{ "}}" }}{{ "{{" }} if eq .Labels.severity "critical" {{ "}}" }}🚨{{ "{{" }} else {{ "}}" }}⚠️{{ "{{" }} end {{ "}}" }} <b>Postgres {{ "{{" }} .Labels.severity {{ "}}" }}: {{ "{{" }} .Labels.alertname {{ "}}" }}</b>
          {{ "{{" }} .Annotations.summary {{ "}}" }}
          {{ "{{" }} .Annotations.description {{ "}}" }}
          {{ "{{" }} else {{ "}}" }}✅ <b>Postgres resolved: {{ "{{" }} .Labels.alertname {{ "}}" }}</b>
          {{ "{{" }} .Annotations.summary {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} define "telegram.node.message" {{ "}}" }}
          {{ "{{" }} range .Alerts {{ "}}" }}
          {{ "{{" }} if eq .Status "firing" {{ "}}" }}{{ "{{" }} if eq .Labels.severity "critical" {{ "}}" }}🚨{{ "{{" }} else {{ "}}" }}⚠️{{ "{{" }} end {{ "}}" }} <b>Node {{ "{{" }} .Labels.severity {{ "}}" }}: {{ "{{" }} .Labels.alertname {{ "}}" }}</b>
          {{ "{{" }} .Annotations.summary {{ "}}" }}
          {{ "{{" }} .Annotations.description {{ "}}" }}
          {{ "{{" }} else {{ "}}" }}✅ <b>Node resolved: {{ "{{" }} .Labels.alertname {{ "}}" }}</b>
          {{ "{{" }} .Annotations.summary {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
  data:
    - secretKey: telegram-bot-token
      remoteRef:
        key: "42ae95a5-778a-4dfe-a432-b43f00c39ba2"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: telegram-chat-id
      remoteRef:
        key: "7e8cfa43-da10-417d-b812-b43f00c3727c"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore

name: gatus-monitoring

services:
  gatus:
    image: ghcr.io/twin/gatus:stable@sha256:094eb186e55235db367e90e9d56140e5897b7044c41de23cde4cc18e6da1242e
    restart: unless-stopped
    environment:
      GATUS_CONFIG_PATH: /config
      GATUS_LOG_LEVEL: ${GATUS_LOG_LEVEL:-INFO}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "127.0.0.1:${GATUS_PORT:-8080}:8080"
    volumes:
      - ./config:/config:ro
      - ./data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    restart: unless-stopped
    depends_on:
      - gatus
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}

  watchtower:
    image: containrrr/watchtower:latest@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Tallinn}
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    command:
      - --label-enable
      - --cleanup
      - --schedule
      - ${WATCHTOWER_SCHEDULE:-0 0 4 * * 0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

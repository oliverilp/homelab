---
# Allow egress to Kubernetes internal networks, DNS, and internet only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-egress
  namespace: librespeed
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Allow DNS (kube-system namespace for CoreDNS)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow same-namespace traffic
  - to:
    - podSelector: {}
  # Allow internet (block all RFC1918 private ranges)
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.0.0.0/8       # Block all 10.x
        - 172.16.0.0/12    # Block private range
        - 192.168.0.0/16   # Block private range

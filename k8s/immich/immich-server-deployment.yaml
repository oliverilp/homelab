apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  labels:
    app: immich-server
spec:
  # 2 replicas for HA: Immich supports multiple server instances behind one
  # Service (all share the same Postgres, Dragonfly, and CephFS upload volume —
  # see https://docs.immich.app/guides/scaling-immich/). Each replica runs both
  # the API and microservices workers; the job queue is coordinated via Redis,
  # so the two cooperate rather than conflict.
  replicas: 2
  # Unlike Nextcloud, Immich has no shared mutable code volume, so a true
  # zero-downtime RollingUpdate is safe: bring up the new pod, wait for it to be
  # Ready, then drop the old one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      # Keep the 2 replicas on different workers so one node failing/draining
      # never takes out both; a drained pod reschedules onto the spare worker.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: immich-server
              topologyKey: kubernetes.io/hostname
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v2.7.5
          ports:
            - containerPort: 2283
              name: http
          env:
            - name: DB_HOSTNAME
              value: "postgres-immich-rw.postgresql.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-auth
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-auth
                  key: password
            - name: DB_DATABASE_NAME
              value: "immichdb"
            - name: REDIS_HOSTNAME
              value: "immich-dragonfly.immich.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-redis-auth
                  key: password
            - name: IMMICH_MACHINE_LEARNING_URL
              value: "http://immich-machine-learning:3003"
            - name: TZ
              value: "Europe/Tallinn"
          resources:
            requests:
              memory: "1100Mi"
              cpu: "180m"
            limits:
              memory: "2000Mi"
          # Readiness gates the Service: with 2 replicas + RollingUpdate, traffic
          # only reaches pods that pass /api/server/ping, so a starting/rolling
          # pod never serves errors. Startup probe covers the slow boot.
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: immich-data
              mountPath: /usr/src/app/upload

      volumes:
        - name: immich-data
          persistentVolumeClaim:
            claimName: immich-data-pvc

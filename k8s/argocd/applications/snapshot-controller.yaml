# CSI snapshot controller + snapshot.storage.k8s.io CRDs (external-snapshotter v8.6.0).
# Vendored upstream manifests — see k8s/snapshot-controller/README.md.
# Ceph-CSI's csi-snapshotter sidecars are no-ops without these cluster-scoped pieces.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapshot-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # CRDs must exist before ceph-csi-drivers (-6) starts its snapshotter sidecars.
    argocd.argoproj.io/sync-wave: "-7"
spec:
  project: default
  source:
    repoURL: "git@github.com:oliverilp/homelab.git"
    path: k8s/snapshot-controller
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      # CRD convention for this repo; also avoids the client-side-apply annotation limit.
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

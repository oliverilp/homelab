apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: nextcloud-dragonfly
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/instance: nextcloud-dragonfly
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: nextcloud
    app.kubernetes.io/managed-by: nextcloud
spec:
  image: ghcr.io/dragonflydb/dragonfly:v2.0.0@sha256:7426fdb31ddcf7bd9499b4205f36ebaa83b26149ba1609a0d5f8f474b3631233
  replicas: 2
  authentication:
    passwordFromSecret:
      name: nextcloud-redis-auth
      key: password
  args:
    - --proactor_threads=1
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
    limits:
      memory: 512Mi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: dragonfly
          topologyKey: kubernetes.io/hostname

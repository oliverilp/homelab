apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: passbolt-database
  namespace: postgresql
spec:
  cluster:
    name: postgres-apps
  name: passboltdb
  owner: passbolt
  databaseReclaimPolicy: retain
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-apps-passbolt-auth-es
  namespace: postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: postgres-apps-passbolt-auth
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: "c3b18413-4119-41a9-bdc4-b48d00d0841b"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: password
      remoteRef:
        key: "e8535532-c2b3-4a3b-8245-b48d00d0b203"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore

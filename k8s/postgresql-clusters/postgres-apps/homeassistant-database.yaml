apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: homeassistant-database
  namespace: postgresql
spec:
  cluster:
    name: postgres-apps
  name: homeassistantdb
  owner: homeassistant
  databaseReclaimPolicy: retain
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-apps-homeassistant-auth-es
  namespace: postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: postgres-apps-homeassistant-auth
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: "88ae855f-78da-49e3-9008-b33c0094592e"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: password
      remoteRef:
        key: "4c262b01-0f87-4647-9639-b33c0094c178"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore

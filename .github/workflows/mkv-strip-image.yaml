name: Build mkv-strip image

on:
  push:
    branches:
      - main
    paths:
      - jobs/mkv-strip/**
      - k8s/mkv-strip/mkv-strip-cronjob.yaml
      - k8s/mkv-strip/mkv-strip-job.yaml
      - .github/workflows/mkv-strip-image.yaml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: mkv-strip-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mkv-strip

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image reference
        id: image
        shell: bash
        run: |
          calver="$(TZ=Europe/Tallinn date '+%Y.%-m.%-d')"
          image_tag="${calver}"
          image_ref="${IMAGE_NAME}:${image_tag}"
          echo "tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "ref=${image_ref}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: jobs/mkv-strip
          file: jobs/mkv-strip/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set pinned image reference
        id: pinned-image
        shell: bash
        run: |
          echo "ref=${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Check Kubernetes manifests
        id: manifests
        shell: bash
        run: |
          if [[ -f k8s/mkv-strip/mkv-strip-cronjob.yaml && -f k8s/mkv-strip/mkv-strip-job.yaml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Kubernetes manifests are not present on this commit; skipping image reference update."
          fi

      - name: Update Kubernetes image references
        if: steps.manifests.outputs.present == 'true'
        uses: mikefarah/yq@v4
        env:
          IMAGE_REF: ${{ steps.pinned-image.outputs.ref }}
        with:
          cmd: |
            yq -i '(.spec.jobTemplate.spec.template.spec.containers[] | select(.name == "mkv-strip").image) = strenv(IMAGE_REF)' k8s/mkv-strip/mkv-strip-cronjob.yaml
            yq -i '(.spec.template.spec.containers[] | select(.name == "mkv-strip").image) = strenv(IMAGE_REF)' k8s/mkv-strip/mkv-strip-job.yaml

      - name: Commit manifest update
        if: steps.manifests.outputs.present == 'true'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          if git diff --quiet -- k8s/mkv-strip/mkv-strip-cronjob.yaml k8s/mkv-strip/mkv-strip-job.yaml; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/mkv-strip/mkv-strip-cronjob.yaml k8s/mkv-strip/mkv-strip-job.yaml
          git commit -m "chore(mkv-strip): update image to ${IMAGE_TAG}"
          git push

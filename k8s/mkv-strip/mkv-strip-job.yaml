apiVersion: batch/v1
kind: Job
metadata:
  generateName: mkv-strip-manual-
  namespace: mkv-strip
  labels:
    app: mkv-strip
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: mkv-strip
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      restartPolicy: Never
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mkv-strip
          image: ghcr.io/oliverilp/mkv-strip:2026.4.26@sha256:2794cb5e9a95157f5a6477242ee045137b2369ae93dd0375f475d02ff3ef5244
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Tallinn
            - name: MKV_STRIP_CONFIG
              value: /etc/mkv-strip/config.json
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - DAC_OVERRIDE
          volumeMounts:
            - name: config
              mountPath: /etc/mkv-strip
              readOnly: true
            - name: media
              mountPath: /media
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: mkv-strip-config
        - name: media
          persistentVolumeClaim:
            claimName: mkv-strip-media-pvc
        - name: tmp
          emptyDir: {}

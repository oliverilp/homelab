image:
  flavor: fpm

nginx:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi

# Two replicas for HA: survive a single worker failure or `kubectl drain` with
# no real outage. Both Nextcloud PVCs are now on CephFS (RWX, proper POSIX
# flock), which unblocks multi-replica — the old NFS deadlock (the entrypoint
# rsyncs the ~27k-file codebase into shared /var/www/html under flock, and NFS
# advisory locking is unreliable) no longer applies. HA across pods/nodes comes
# from 2 replicas + PDB + anti-affinity (see below), independent of update
# strategy. All deps are already HA (Dragonfly, CNPG postgres-apps, Collabora).
replicaCount: 2

deploymentAnnotations:
  configmap.reloader.stakater.com/reload: nextcloud-homelab-config

ingress:
  enabled: false

httpRoute:
  enabled: false

phpClientHttpsFix:
  enabled: true
  protocol: https

nextcloud:
  # HA (against node/pod failure) = 2 replicas + PDB + anti-affinity, which is
  # independent of update strategy (strategy gates rollouts, not evictions or
  # failures). Recreate is retained because /var/www/html (the Nextcloud code)
  # is a single shared RWX volume for all replicas: a RollingUpdate would let a
  # new-version pod rsync new code into that shared dir while old-version pods
  # still serve it → two code versions against one codebase → corruption.
  # Consequence/accepted tradeoff: every pod-template change — a reloader config
  # reload or a chart/image version bump — is a brief (~1-2 min) full-restart
  # outage. Upgrades are always correct; that is the point of Recreate here.
  strategy:
    type: Recreate
  host: cloud.oliverilp.ee
  trustedDomains:
    - cloud.oliverilp.ee
  existingSecret:
    enabled: true
    secretName: nextcloud-admin-credentials
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password
  # The chart only renders and mounts its default config files when this map is non-empty.
  configs:
    defaults-enabled.config.php: |-
      <?php
      $CONFIG = array ();
  extraVolumes:
    - name: nextcloud-homelab-config
      configMap:
        name: nextcloud-homelab-config
  extraVolumeMounts:
    - name: nextcloud-homelab-config
      mountPath: /var/www/html/config/proxy.config.php
      subPath: proxy.config.php
      readOnly: true
    - name: nextcloud-homelab-config
      mountPath: /usr/local/etc/php/conf.d/zz-homelab.ini
      subPath: zz-homelab.ini
      readOnly: true
    - name: nextcloud-homelab-config
      mountPath: /usr/local/etc/php-fpm.d/zz-homelab.conf
      subPath: zz-homelab-fpm.conf
      readOnly: true
  podSecurityContext:
    fsGroup: 33
    fsGroupChangePolicy: OnRootMismatch
  lifecycle:
    postStart:
      exec:
        command:
          - /bin/sh
          - -c
          # With Recreate, both replicas start together. Serialize the upgrade
          # across them via flock on the shared CephFS data volume so exactly
          # one pod runs the real migrations; the other blocks then no-ops
          # (all occ steps are idempotent). The lock inode lives on the shared
          # nextcloud-data-pvc so every pod contends on the same file.
          - |
            flock /var/www/html/data/.occ-upgrade.lock sh -c '
              php occ upgrade --no-interaction
              php occ db:add-missing-columns
              php occ db:add-missing-indices
              php occ db:add-missing-primary-keys
              php occ maintenance:mode --off
            '

internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  host: postgres-apps-rw.postgresql.svc.cluster.local:5432
  database: nextclouddb
  user: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-postgres-auth
    usernameKey: username
    passwordKey: password

mariadb:
  enabled: false

postgresql:
  enabled: false

redis:
  enabled: false

externalRedis:
  enabled: true
  host: nextcloud-dragonfly.nextcloud.svc.cluster.local
  port: "6379"
  existingSecret:
    enabled: true
    secretName: nextcloud-redis-auth
    passwordKey: password

cronjob:
  enabled: true
  type: cronjob
  cronjob:
    securityContext:
      runAsUser: 33
      runAsGroup: 33
    resources:
      requests:
        cpu: 20m
        memory: 100Mi
      limits:
        memory: 100Mi

service:
  type: ClusterIP
  port: 8080

persistence:
  enabled: true
  existingClaim: nextcloud-html-pvc
  accessMode: ReadWriteMany
  nextcloudData:
    enabled: true
    existingClaim: nextcloud-data-pvc
    accessMode: ReadWriteMany

livenessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 10

startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 180

resources:
  requests:
    cpu: 10m
    memory: 300Mi
  limits:
    memory: 300Mi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
  # Keep the 2 replicas on 2 different workers so one node failing/draining never
  # takes out both. A drained pod can reschedule onto the 3rd (spare) worker.
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: nextcloud
            app.kubernetes.io/instance: nextcloud
            app.kubernetes.io/component: app

collabora:
  enabled: true
  replicaCount: 2
  autoscaling:
    enabled: false
  collabora:
    aliasgroups:
      - host: "https://cloud.oliverilp.ee"
    extra_params: "--o:ssl.enable=false --o:ssl.termination=true"
    server_name: collabora.oliverilp.ee
    existingSecret:
      enabled: true
      secretName: nextcloud-collabora-admin
      usernameKey: username
      passwordKey: password
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 1500Mi
    limits:
      memory: 1500Mi

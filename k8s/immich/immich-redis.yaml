apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: immich-dragonfly
  namespace: immich
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/instance: immich-dragonfly
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: immich
    app.kubernetes.io/managed-by: immich
spec:
  image: ghcr.io/dragonflydb/dragonfly:v1.38.1@sha256:baf70ba7ad182a992b988497cfa31a488978c8fab7712079784c2401f447e402
  replicas: 2
  args:
    - "--default_lua_flags=allow-undeclared-keys,disable-atomicity"
  authentication:
    passwordFromSecret:
      name: immich-redis-auth
      key: password
  resources:
    requests:
      cpu: 10m
      memory: 220Mi
    limits:
      memory: 220Mi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: dragonfly
          topologyKey: kubernetes.io/hostname

# Decide whether the client is a browser navigation (wants HTML) or an API/XHR
# client (wants data). Traefik's `errors` middleware forwards the original
# request headers to this service, so $http_accept reflects the real client.
# Browsers send "Accept: text/html,..."; fetch/XHR/curl/API clients send
# "application/json" or "*/*" and must NEVER receive our HTML landing page.
map $http_accept $wants_html {
    default       0;
    "~*text/html" 1;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Default content type for the JSON fallback responses below.
    default_type application/json;

    location = /healthz {
        access_log off;
        return 204;
    }

    # Traefik requests the styled page as "/<status>.html" (see Middleware
    # query template). Note: Traefik preserves the ORIGINAL status code; the
    # status we return here is ignored — only the body is used.
    location ~ "^/(?<code>[0-9]{3})\.html$" {
        # API / non-browser clients: return generic JSON, never HTML, so their
        # parsers don't choke on an HTML document.
        if ($wants_html = 0) {
            return 200 '{"error":true,"status":$code}';
        }
        # Browser navigations (including history autofill of deep URLs): serve
        # the styled page, falling back to the generic 404 page if we don't
        # ship a template for this specific code.
        try_files /$code.html /404.html;
    }

    location / {
        if ($wants_html = 0) {
            return 404 '{"error":true,"status":404}';
        }
        error_page 404 /404.html;
        return 404;
    }
}

---
# Allow egress to Kubernetes internal networks, DNS, and internet (for S3 backups)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-egress
  namespace: postgresql
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Allow DNS (kube-system namespace for CoreDNS)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow same-namespace traffic
  - to:
    - podSelector: {}
  # Allow internet for S3 backups (block all RFC1918 private ranges)
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.0.0.0/8       # Block all 10.x
        - 172.16.0.0/12    # Block private range
        - 192.168.0.0/16   # Block private range

---
# Allow egress to Kubernetes API server (CNPG instance manager needs API access)
# Uses CiliumNetworkPolicy because API server runs on host network and Cilium
# DNATs service ClusterIP to node IPs before egress policy evaluation
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: postgresql
spec:
  endpointSelector: {}
  egress:
  - toEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP

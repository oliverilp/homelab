global:
  domain: argocd.oliverilp.ee

configs:
  cm:
    url: "https://argocd.oliverilp.ee"
    application.instanceLabelKey: argocd.argoproj.io/instance
    resource.exclusions: |
      - apiGroups:
        - ""
        kinds:
        - Endpoints
        - Event
        clusters:
        - "*"
      - apiGroups:
        - "metrics.k8s.io"
        kinds:
        - "*"
        clusters:
        - "*"
    oidc.config: |
      name: Authentik
      issuer: https://auth.oliverilp.ee/application/o/argo-cd/
      clientID: $oidc.authentik.clientID
      clientSecret: $oidc.authentik.clientSecret
      requestedScopes: ["openid", "profile", "email", "groups"]
      requestedIDTokenClaims: {"groups": {"essential": true}}
  rbac:
    scopes: "[groups]"
    policy.csv: |
      g, Homelab Owners, role:admin

server:
  replicas: 2
  service:
    type: ClusterIP

  extraArgs:
    - --insecure

  metrics:
    enabled: true

  resources:
    requests:
      cpu: 10m
      memory: 230Mi
    limits:
      memory: 230Mi

repoServer:
  replicas: 2
  metrics:
    enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 220Mi
    limits:
      memory: 220Mi

controller:
  metrics:
    enabled: true

  resources:
    requests:
      cpu: 90m
      memory: 1200Mi
    limits:
      memory: 1200Mi

applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi

redis:
  enabled: false
redis-ha:
  enabled: false
externalRedis:
  host: argocd-dragonfly.argocd.svc.cluster.local
  port: 6379
  existingSecret: argocd-redis-auth
  existingSecretPasswordKey: redis-password

# Disable dex (OIDC) for now - use admin user
dex:
  enabled: false

# Notifications controller - disabled for now
notifications:
  enabled: false

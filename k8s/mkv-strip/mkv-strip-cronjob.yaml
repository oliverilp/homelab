apiVersion: batch/v1
kind: CronJob
metadata:
  name: mkv-strip
  namespace: mkv-strip
  labels:
    app: mkv-strip
spec:
  schedule: "30 0 * * *"
  timeZone: Europe/Tallinn
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: mkv-strip
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          hostIPC: false
          hostNetwork: false
          hostPID: false
          restartPolicy: Never
          shareProcessNamespace: false
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mkv-strip
              image: ghcr.io/oliverilp/mkv-strip:2026.4.26@sha256:f7505bd65ca10625fa525e1419cf33d4ced1e4c88521191a998d8a2d66fa4289
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  value: Europe/Tallinn
                - name: MKV_STRIP_CONFIG
                  value: /etc/mkv-strip/config.json
              resources:
                requests:
                  cpu: 500m
                  memory: 256Mi
                limits:
                  cpu: "2"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                  add:
                    - DAC_OVERRIDE
              volumeMounts:
                - name: config
                  mountPath: /etc/mkv-strip
                  readOnly: true
                - name: media
                  mountPath: /media
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: mkv-strip-config
            - name: media
              persistentVolumeClaim:
                claimName: mkv-strip-media-pvc
            - name: tmp
              emptyDir: {}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: filestash
  namespace: filestash
  annotations:
    external-dns.alpha.kubernetes.io/hostname: files.oliverilp.ee
spec:
  parentRefs:
    - name: traefik-internal-gateway
      namespace: traefik
  hostnames:
    - "files.oliverilp.ee"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: filestash
          port: 8334

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: volume-snapshot-monthly
  namespace: volume-snapshots
  labels:
    app: volume-snapshotter
    tier: monthly
spec:
  schedule: "0 4 1 * *"
  timeZone: Europe/Tallinn
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: volume-snapshotter
            tier: monthly
        spec:
          serviceAccountName: volume-snapshotter
          automountServiceAccountToken: true
          enableServiceLinks: false
          hostIPC: false
          hostNetwork: false
          hostPID: false
          restartPolicy: Never
          shareProcessNamespace: false
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshotter
              image: docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/snapshot.sh"]
              env:
                - name: TZ
                  value: Europe/Tallinn
                - name: HOME
                  value: /tmp
                - name: TIER
                  value: monthly
                - name: RETAIN
                  value: "12"
                # Only this tier sweeps snapshots whose source PVC was deleted — the
                # per-PVC loops never revisit them, so they would pin space forever.
                - name: ORPHAN_SWEEP
                  value: "true"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: volume-snapshotter-script
            - name: tmp
              emptyDir: {}

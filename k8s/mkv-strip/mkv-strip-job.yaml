apiVersion: batch/v1
kind: Job
metadata:
  generateName: mkv-strip-manual-
  namespace: mkv-strip
  labels:
    app: mkv-strip
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: mkv-strip
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mkv-strip
          image: ghcr.io/oliverilp/mkv-strip:sha-7cea8401fd01
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Tallinn
            - name: MKV_STRIP_CONFIG
              value: /etc/mkv-strip/config.json
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/mkv-strip
              readOnly: true
            - name: media
              mountPath: /media
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: mkv-strip-config
        - name: media
          persistentVolumeClaim:
            claimName: mkv-strip-media-pvc
        - name: tmp
          emptyDir: {}

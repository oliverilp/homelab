apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stump
  namespace: stump
  labels:
    app: stump
spec:
  serviceName: stump
  replicas: 1
  selector:
    matchLabels:
      app: stump
  template:
    metadata:
      labels:
        app: stump
      annotations:
        configmap.reloader.stakater.com/reload: "stump-config"
        secret.reloader.stakater.com/reload: "stump-app-secrets"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      shareProcessNamespace: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stump
          image: aaronleopold/stump:latest@sha256:09a3bfbfa6c44fade1e82b2f13fcd568062da85c760050ec0648ad89fd4dce5f
          ports:
            - name: http
              containerPort: 10801
              protocol: TCP
          envFrom:
            - configMapRef:
                name: stump-config
            - secretRef:
                name: stump-app-secrets
          resources:
            requests:
              cpu: 10m
              memory: 500Mi
            limits:
              memory: 700Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: stump-data
              mountPath: /config
            - name: stump-manga
              mountPath: /data/manga
              readOnly: true
            - name: stump-comics
              mountPath: /data/comics
              readOnly: true
            - name: stump-ebooks
              mountPath: /data/ebooks
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: root-cache
              mountPath: /root/.cache
          startupProbe:
            httpGet:
              path: /
              port: 10801
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 10801
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 10801
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: stump-data
          persistentVolumeClaim:
            claimName: stump-data-pvc
        - name: stump-manga
          persistentVolumeClaim:
            claimName: stump-shared-manga-pvc
        - name: stump-comics
          persistentVolumeClaim:
            claimName: stump-shared-comics-pvc
        - name: stump-ebooks
          persistentVolumeClaim:
            claimName: stump-shared-ebooks-pvc
        - name: tmp
          emptyDir: {}
        - name: root-cache
          emptyDir: {}

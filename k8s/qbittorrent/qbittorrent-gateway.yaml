apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: qbittorrent
  annotations:
    external-dns.alpha.kubernetes.io/hostname: qbittorrent.oliverilp.ee
spec:
  parentRefs:
    - name: traefik-internal-gateway
      namespace: traefik
  hostnames:
    - "qbittorrent.oliverilp.ee"
  rules:
    # Authentication endpoint - embedded outpost on authentik-server:9000
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io/
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 9000
    # Main application - lower priority (comes second)
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik
            namespace: traefik
      backendRefs:
        - name: qbittorrent
          port: 9092

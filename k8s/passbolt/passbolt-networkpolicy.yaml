---
# Default deny all ingress traffic except from same namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: passbolt
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# Allow traffic from within the same namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: passbolt
spec:
  podSelector: {}
  ingress:
  - from:
    - podSelector: {}

---
# Allow ingress from Traefik (for web access to Passbolt)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: passbolt
spec:
  podSelector: {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik

---
# Allow health checks from Kubernetes nodes (kubelet) on web ports only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-health-checks
  namespace: passbolt
spec:
  podSelector: {}
  ingress:
  - from:
    - ipBlock:
        cidr: 10.1.20.0/24  # Kubernetes nodes subnet
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443

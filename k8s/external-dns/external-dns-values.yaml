provider:
  name: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: external-dns-cf-token
        key: apiKey

rbac:
  create: true

serviceAccount:
  create: true
  name: external-dns

policy: sync

# v0.22.0 default prefix is external-dns.kubernetes.io/ with no fallback; without
# this the Gateway target annotation (dc1.oliverilp.ee) is ignored and every
# public record became an A to the private LB IP 10.1.20.50 (2026-09-14).
annotationPrefix: external-dns.alpha.kubernetes.io/

registry: txt
txtOwnerId: external-dns-homelab

logLevel: info

sources:
  - service
  - ingress
  - gateway-httproute

domainFilters:
  - oliverilp.ee
  - crunchyroll.ee

interval: 1m
triggerLoopOnEvent: true

resources:
  requests:
    cpu: 90m
    memory: 130Mi
  limits:
    memory: 130Mi

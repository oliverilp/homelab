apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mqtt
  namespace: homeassistant
  labels:
    app: mqtt
spec:
  serviceName: mqtt
  replicas: 1
  selector:
    matchLabels:
      app: mqtt
  template:
    metadata:
      labels:
        app: mqtt
    spec:
      containers:
        - name: mqtt
          image: eclipse-mosquitto:2.0.22@sha256:09b62ff32c2e7b64d4b431b9a89236073289b68db273de2b089edeb9b0d92b5c
          ports:
            - containerPort: 1883
              name: mqtt
            - containerPort: 9001
              name: websocket
          command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
            limits:
              memory: 100Mi
          volumeMounts:
            - name: mqtt-data
              mountPath: /mosquitto
      volumes:
        - name: mqtt-data
          persistentVolumeClaim:
            claimName: mqtt-data-pvc

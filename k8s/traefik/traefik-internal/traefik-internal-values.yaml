service:
  type: LoadBalancer
  spec:
    loadBalancerIP: 10.1.20.51

providers:
  kubernetesCRD:
    enabled: true
  kubernetesGateway:
    enabled: true

additionalArguments:
  - "--entryPoints.web.http.middlewares=traefik-error-pages@kubernetescrd"
  - "--entryPoints.websecure.http.middlewares=traefik-error-pages@kubernetescrd"

ports:
  websecure:
    http3:
      enabled: true

gateway:
  enabled: false

gatewayClass:
  enabled: true
  name: traefik-internal

ingressClass:
  enabled: false
  isDefaultClass: false

metrics:
  prometheus:
    enabled: true
    service:
      labels:
        gateway-type: internal

deployment:
  replicas: 2
  podLabels:
    gateway-type: internal
    traefik-instance: internal

resources:
  requests:
    cpu: 50m
    memory: 120Mi
  limits:
    memory: 120Mi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              traefik-instance: internal
          topologyKey: kubernetes.io/hostname

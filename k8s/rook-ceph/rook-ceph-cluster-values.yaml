# Overrides for the rook-ceph-cluster Helm chart (CephCluster CR).
# Bare-minimum cluster: mons, mgrs, OSDs on the passthrough disk, and the dashboard.
# No CephBlockPool / CephFilesystem / CephObjectStore / StorageClass yet — those are a
# follow-up once the cluster reports HEALTH_OK.

operatorNamespace: rook-ceph

toolbox:
  enabled: true # rook-ceph-tools pod for `ceph status` debugging

monitoring:
  enabled: false # defer ServiceMonitor / PrometheusRules wiring

cephClusterSpec:
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 3
    allowMultiplePerNode: false
  dashboard:
    enabled: true
    ssl: false
  storage:
    useAllNodes: true
    useAllDevices: false
    deviceFilter: "^sdb$" # only the empty ~761G passthrough disk; never /dev/sda (boot)
  # Trim the chart's production-sized resource *requests* to fit this homelab.
  # The scheduler reserves on requests, and the defaults (osd 4Gi/1cpu, mon 1Gi/1cpu)
  # filled the workers to ~99% and blocked other pods. Limits stay generous so pods can
  # still burst. Rook auto-derives osd_memory_target from the OSD request, so lowering it
  # also caps actual OSD cache usage (no OOM risk). Other components (prepareosd,
  # crashcollector, exporter, …) keep their small chart defaults.
  resources:
    mon:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        memory: "1Gi"
    mgr:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        memory: "1Gi"
    osd:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        memory: "3Gi"

# Disable the chart's default pools / filesystems / object stores — out of scope for now.
cephBlockPools: []
cephFileSystems: []
cephObjectStores: []

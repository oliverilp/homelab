apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: librespeed-route
  namespace: librespeed
  annotations:
    external-dns.alpha.kubernetes.io/hostname: speedtest.oliverilp.ee
spec:
  parentRefs:
    - name: traefik-public-gateway
      namespace: traefik
  hostnames:
    - speedtest.oliverilp.ee
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: librespeed
          port: 8080

---
# Default deny all ingress traffic except from same namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: librespeed
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# Allow traffic from within the same namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: librespeed
spec:
  podSelector: {}
  ingress:
  - from:
    - podSelector: {}

---
# Allow ingress from Traefik (for web access)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: librespeed
spec:
  podSelector: {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik


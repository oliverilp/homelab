apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram-config-es
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: "null"
            group_by:
              - namespace
            routes:
              - receiver: "null"
                matchers:
                  - alertname = "Watchdog"
              - receiver: telegram
                matchers:
                  - alertname = "HomelabServiceDown"
                group_by:
                  - alertname
                  - service
                  - instance
                group_wait: 0s
                group_interval: 5m
                repeat_interval: 12h
              - receiver: telegram-argocd
                matchers:
                  - alertname =~ "ArgoCDAppOutOfSync|ArgoCDAppUnhealthy|ArgoCDAppSyncFailed"
                group_by:
                  - alertname
                  - name
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 12h
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
          inhibit_rules:
            - target_matchers:
                - severity =~ warning|info
              source_matchers:
                - severity = critical
              equal:
                - namespace
                - alertname
            - target_matchers:
                - severity = info
              source_matchers:
                - severity = warning
              equal:
                - namespace
                - alertname
            - target_matchers:
                - severity = info
              source_matchers:
                - alertname = InfoInhibitor
              equal:
                - namespace
            - target_matchers:
                - alertname = InfoInhibitor
          receivers:
            - name: "null"
            - name: telegram
              telegram_configs:
                - bot_token: '{{ index . "telegram-bot-token" }}'
                  chat_id: {{ index . "telegram-chat-id" }}
                  parse_mode: HTML
                  send_resolved: true
                  message: '{{ "{{" }} template "telegram.homelab.message" . {{ "}}" }}'
            - name: telegram-argocd
              telegram_configs:
                - bot_token: '{{ index . "telegram-bot-token" }}'
                  chat_id: {{ index . "telegram-chat-id" }}
                  parse_mode: HTML
                  send_resolved: true
                  message: '{{ "{{" }} template "telegram.argocd.message" . {{ "}}" }}'
          templates:
            - /etc/alertmanager/config/*.tmpl
        telegram.tmpl: |
          {{ "{{" }} define "telegram.homelab.message" {{ "}}" }}
          {{ "{{" }} range .Alerts {{ "}}" }}
          {{ "{{" }} if eq .Status "firing" {{ "}}" }}🚨 <b>DOWN {{ "{{" }} .Labels.service {{ "}}" }}</b> 🚨
          {{ "{{" }} .Labels.instance {{ "}}" }} failed three consecutive 1-minute HTTP probes.
          {{ "{{" }} else {{ "}}" }}✅ <b>RESOLVED {{ "{{" }} .Labels.service {{ "}}" }}</b> ✅
          {{ "{{" }} .Labels.instance {{ "}}" }} is responding again.
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} define "telegram.argocd.message" {{ "}}" }}
          {{ "{{" }} range .Alerts {{ "}}" }}
          {{ "{{" }} if eq .Status "firing" {{ "}}" }}⚠️ <b>ArgoCD: {{ "{{" }} .Labels.name {{ "}}" }}</b>
          {{ "{{" }} .Annotations.summary {{ "}}" }}
          {{ "{{" }} .Annotations.description {{ "}}" }}
          {{ "{{" }} else {{ "}}" }}✅ <b>ArgoCD OK: {{ "{{" }} .Labels.name {{ "}}" }}</b>
          {{ "{{" }} .Annotations.summary {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}
  data:
    - secretKey: telegram-bot-token
      remoteRef:
        key: "42ae95a5-778a-4dfe-a432-b43f00c39ba2"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: telegram-chat-id
      remoteRef:
        key: "7e8cfa43-da10-417d-b812-b43f00c3727c"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager-route
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/hostname: alertmanager.oliverilp.ee
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-internal-gateway
      namespace: traefik
  hostnames:
    - alertmanager.oliverilp.ee
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        # Schema defaults spelled out: this app syncs with ServerSideApply, so
        # ArgoCD's client-side diff has no last-applied annotation to merge
        # against and reports CRD-defaulted fields as permanent drift.
        - group: ""
          kind: Service
          name: authentik-server
          namespace: authentik
          port: 80
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-forward-auth
      backendRefs:
        - group: ""
          kind: Service
          name: prometheus-alertmanager
          port: 9093
          weight: 1

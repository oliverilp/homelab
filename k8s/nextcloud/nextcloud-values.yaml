image:
  flavor: fpm

nginx:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi

# Single replica: /var/www/html (code) is on shared NFS, so the startup
# rsync of the ~27k-file codebase deadlocks when multiple pods hold the
# files open during a version bump. One replica + Recreate (below) lets the
# single pod rsync the volume uncontended. HA was traded away deliberately.
replicaCount: 1

deploymentAnnotations:
  configmap.reloader.stakater.com/reload: nextcloud-homelab-config

ingress:
  enabled: false

httpRoute:
  enabled: false

phpClientHttpsFix:
  enabled: true
  protocol: https

nextcloud:
  # /var/www/html (Nextcloud code) is a shared RWX volume across replicas, so
  # two versions must never run against it at once. Recreate terminates all old
  # pods before new ones start; the entrypoint's flock then serializes the code
  # rsync + `occ upgrade` cleanly. RollingUpdate here deadlocks on version bumps
  # (new pod's rsync --delete stalls on NFS while old pods hold the files open).
  strategy:
    type: Recreate
  host: cloud.oliverilp.ee
  trustedDomains:
    - cloud.oliverilp.ee
  existingSecret:
    enabled: true
    secretName: nextcloud-admin-credentials
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password
  # The chart only renders and mounts its default config files when this map is non-empty.
  configs:
    defaults-enabled.config.php: |-
      <?php
      $CONFIG = array ();
  extraVolumes:
    - name: nextcloud-homelab-config
      configMap:
        name: nextcloud-homelab-config
  extraVolumeMounts:
    - name: nextcloud-homelab-config
      mountPath: /var/www/html/config/proxy.config.php
      subPath: proxy.config.php
      readOnly: true
    - name: nextcloud-homelab-config
      mountPath: /usr/local/etc/php/conf.d/zz-homelab.ini
      subPath: zz-homelab.ini
      readOnly: true
    - name: nextcloud-homelab-config
      mountPath: /usr/local/etc/php-fpm.d/zz-homelab.conf
      subPath: zz-homelab-fpm.conf
      readOnly: true
  podSecurityContext:
    fsGroup: 33
    fsGroupChangePolicy: OnRootMismatch

internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  host: postgres-apps-rw.postgresql.svc.cluster.local:5432
  database: nextclouddb
  user: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-postgres-auth
    usernameKey: username
    passwordKey: password

mariadb:
  enabled: false

postgresql:
  enabled: false

redis:
  enabled: false

externalRedis:
  enabled: true
  host: nextcloud-dragonfly.nextcloud.svc.cluster.local
  port: "6379"
  existingSecret:
    enabled: true
    secretName: nextcloud-redis-auth
    passwordKey: password

cronjob:
  enabled: true
  type: cronjob
  cronjob:
    securityContext:
      runAsUser: 33
      runAsGroup: 33
    resources:
      requests:
        cpu: 20m
        memory: 100Mi
      limits:
        memory: 100Mi

service:
  type: ClusterIP
  port: 8080

persistence:
  enabled: true
  existingClaim: nextcloud-html-pvc
  accessMode: ReadWriteMany
  nextcloudData:
    enabled: true
    existingClaim: nextcloud-data-pvc
    accessMode: ReadWriteMany

livenessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 10

startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 180

resources:
  requests:
    cpu: 10m
    memory: 300Mi
  limits:
    memory: 300Mi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist

collabora:
  enabled: true
  replicaCount: 2
  autoscaling:
    enabled: false
  collabora:
    aliasgroups:
      - host: "https://cloud.oliverilp.ee"
    extra_params: "--o:ssl.enable=false --o:ssl.termination=true"
    server_name: collabora.oliverilp.ee
    existingSecret:
      enabled: true
      secretName: nextcloud-collabora-admin
      usernameKey: username
      passwordKey: password
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 1500Mi
    limits:
      memory: 1500Mi

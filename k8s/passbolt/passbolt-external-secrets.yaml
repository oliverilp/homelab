apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passbolt-env-es
  namespace: passbolt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: passbolt-env
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATASOURCES_DEFAULT_USERNAME: "{{ .username }}"
        DATASOURCES_DEFAULT_PASSWORD: "{{ .password }}"
        DATASOURCES_DEFAULT_DATABASE: "passboltdb"
        # Normally assembled by the chart's secret-env template; we override
        # passboltEnv.secretName, so it has to be built here.
        DATASOURCES_DEFAULT_URL: "postgres://{{ .username }}:{{ .password }}@postgres-apps-rw.postgresql.svc.cluster.local:5432/passboltdb?schema=public"
        CACHE_DEFAULT_PASSWORD: "{{ .redisPassword }}"
        CACHE_CAKECORE_PASSWORD: "{{ .redisPassword }}"
        CACHE_CAKEMODEL_PASSWORD: "{{ .redisPassword }}"
        EMAIL_TRANSPORT_DEFAULT_USERNAME: "{{ .smtpUsername }}"
        EMAIL_TRANSPORT_DEFAULT_PASSWORD: "{{ .smtpPassword }}"
        SECURITY_SALT: "{{ .securitySalt }}"
        PASSBOLT_GPG_SERVER_KEY_FINGERPRINT: "{{ .gpgFingerprint }}"
  data:
    - secretKey: username
      remoteRef:
        key: "6b9c7c72-c572-4ad4-84b3-b48d00d38ff8"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: password
      remoteRef:
        key: "378250db-13fc-4362-b6f1-b48d00d3a62c"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: redisPassword
      remoteRef:
        key: "b9f897f5-6cb1-4980-939b-b48d00d34d5e"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: smtpUsername
      remoteRef:
        key: "0a8484ff-0236-445c-9e80-b48d00d2ffd9"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: smtpPassword
      remoteRef:
        key: "bee1c6f8-6adf-47dd-bf3b-b48d00d2dc8e"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: securitySalt
      remoteRef:
        key: "f2180791-665f-43de-abb6-b48d00d8f03a"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: gpgFingerprint
      remoteRef:
        key: "a93668fa-6be5-4b98-b9d6-b48d00d7ff38"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore

---
# Mounted at /etc/passbolt/gpg. Values must be the armored keys as plain text.
# This is the root of trust for every secret stored in Passbolt — back it up.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passbolt-gpg-es
  namespace: passbolt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: passbolt-gpg
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        serverkey.asc: "{{ .public }}"
        serverkey_private.asc: "{{ .private }}"
  data:
    - secretKey: public
      remoteRef:
        key: "83d6b719-d350-41b9-b359-b48d00d77614"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: private
      remoteRef:
        key: "5950cf24-0135-429b-8b74-b48d00d7ab74"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore

---
# Mounted at /etc/passbolt/jwt. Values must be the PEM keys as plain text.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passbolt-jwt-es
  namespace: passbolt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: passbolt-jwt
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        jwt.key: "{{ .private }}"
        jwt.pem: "{{ .public }}"
  data:
    - secretKey: private
      remoteRef:
        key: "cbfe451e-3086-4934-9790-b48d00d8668f"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: public
      remoteRef:
        key: "78084bed-5f40-4dfa-b0f4-b48d00d8a848"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore

---
# Same Bitwarden secret as CACHE_*_PASSWORD above — the two must match.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passbolt-redis-auth-es
  namespace: passbolt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: passbolt-redis-auth
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: password
      remoteRef:
        key: "b9f897f5-6cb1-4980-939b-b48d00d34d5e"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore

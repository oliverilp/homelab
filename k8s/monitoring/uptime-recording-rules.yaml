apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: uptime-recording-rules
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
spec:
  groups:
    - name: uptime.cluster
      interval: 1m
      rules:
        - record: cluster:apiserver:up1m
          expr: |
            max(max_over_time(up{job="apiserver"}[1m])) or vector(0)

    - name: uptime.probes
      interval: 1m
      rules:
        - record: probe:success:rate1m
          expr: |
            min_over_time(probe_success{job=~"probe/.*"}[3m])
        - record: probe:down:sustained3m
          expr: |
            (count_over_time(probe_success{job=~"probe/.*"}[3m]) >= bool 3)
            *
            (max_over_time(probe_success{job=~"probe/.*"}[3m]) == bool 0)

    - name: uptime.alerts
      interval: 1m
      rules:
        - alert: HomelabServiceDown
          expr: probe:down:sustained3m{job=~"probe/.*"} == 1
          labels:
            severity: critical
            namespace: monitoring
          annotations:
            summary: "{{ $labels.service }} is down"
            description: "{{ $labels.instance }} has failed at least three consecutive 1-minute HTTP probes."

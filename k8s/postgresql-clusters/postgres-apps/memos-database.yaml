apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: memos-database
  namespace: postgresql
spec:
  cluster:
    name: postgres-apps
  name: memosdb
  owner: memos
  databaseReclaimPolicy: retain
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-apps-memos-auth-es
  namespace: postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: postgres-apps-memos-auth
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: "94c53cf6-453b-4de3-bd9f-b31800d7cb29"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: password
      remoteRef:
        key: "b26308a3-a0f5-4779-8a87-b31800d7f130"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-redis-auth-es
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: argocd-redis-auth
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: redis-password
      remoteRef:
        key: "fd83e57d-97af-4831-8dac-b31800e1b179"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-es
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: argocd-secret
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: admin.password
      remoteRef:
        key: "cab933cd-0a49-4a66-8fab-b31d0148083e"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
    - secretKey: admin.passwordMtime
      remoteRef:
        key: "c8a5902b-4db5-4d72-9dd4-b31d01483cf0"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch

    - secretKey: server.secretkey
      remoteRef:
        key: "f98fc7a0-cbf1-4d30-abaa-b31d014860ae"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch

    - secretKey: oidc.authentik.clientID
      remoteRef:
        key: "eaefd1d1-bc88-4042-880c-b31d013fb268"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
    - secretKey: oidc.authentik.clientSecret
      remoteRef:
        key: "88f267f0-b33f-418f-a5f5-b31d013fde95"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch

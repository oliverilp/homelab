apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: homeassistant
  namespace: homeassistant
  labels:
    app: homeassistant
spec:
  serviceName: homeassistant
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
      annotations:
        configmap.reloader.stakater.com/reload: "homeassistant-config"
    spec:
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
          ports:
            - containerPort: 8123
              name: http
          env:
            - name: TZ
              value: "Europe/Tallinn"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: MQTT_BROKER_URL
              value: "mqtt:1883"
          # RSS ~380Mi after start, +10-20Mi retained per nightly automatic backup (~05:00 local), never freed.
          # 550Mi limit → OOMKilled mid-backup every ~8-12d (2026-10-01, 10-11). Limit headroom ≈ 30d; image bumps restart sooner.
          resources:
            requests:
              cpu: 10m
              memory: 550Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: homeassistant-config
              mountPath: /config
            - name: homeassistant-config-file
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
      volumes:
        - name: homeassistant-config
          persistentVolumeClaim:
            claimName: homeassistant-data-pvc
        - name: homeassistant-config-file
          configMap:
            name: homeassistant-config

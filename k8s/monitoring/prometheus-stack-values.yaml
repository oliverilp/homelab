fullnameOverride: prometheus

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

alertmanager:
  fullnameOverride: alertmanager
  enabled: true
  ingress:
    enabled: false
  alertmanagerSpec:
    externalUrl: https://alertmanager.oliverilp.ee
    replicas: 2
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 100Mi
    configSecret: alertmanager-telegram-config
    storage:
      disableMountSubPath: true
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    podAntiAffinity: "hard"

grafana:
  enabled: true
  fullnameOverride: grafana
  replicas: 2
  forceDeployDatasources: false
  forceDeployDashboards: false
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: utc
  serviceMonitor:
    enabled: true
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      root_url: https://grafana.oliverilp.ee   # OAuth redirect base
    database:
      type: postgres
      host: postgres-apps-rw.postgresql.svc.cluster.local:5432
      name: grafanadb
      user: grafana
      ssl_mode: disable
    auth.generic_oauth:
      enabled: true
      name: Authentik
      # client_id/secret injected as GF_AUTH_GENERIC_OAUTH_* env from grafana-oauth
      # groups claim rides in Authentik's default 'profile' scope mapping
      scopes: "openid email profile"
      auth_url: https://auth.oliverilp.ee/application/o/authorize/
      token_url: https://auth.oliverilp.ee/application/o/token/
      api_url: https://auth.oliverilp.ee/application/o/userinfo/
      allow_sign_up: true
      # Homelab Owners → Admin; strict denies login when no group matches
      role_attribute_path: "contains(groups[*], 'Homelab Owners') && 'Admin'"
      role_attribute_strict: true
  envFromSecret: grafana-postgres-auth
  envFromSecrets:
    - name: grafana-oauth
  resources:
    requests:
      cpu: 30m
      memory: 750Mi
    limits:
      memory: 750Mi
  additionalDataSources:
    - name: Prometheus Long-term
      type: prometheus
      access: proxy
      url: http://prometheus-longterm.monitoring.svc:9090
      isDefault: false
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 110Mi
      limits:
        memory: 110Mi

kubeApiServer:
  enabled: true

kubelet:
  enabled: true
  serviceMonitor:
    metricRelabelings:
      - action: replace
        sourceLabels:
          - node
        targetLabel: instance

kubeControllerManager:
  enabled: true
  endpoints: # ips of servers
    - 10.1.20.11
    - 10.1.20.12
    - 10.1.20.13

coreDns:
  enabled: true

kubeDns:
  enabled: false

kubeEtcd:
  enabled: true
  endpoints: # ips of servers
    - 10.1.20.11
    - 10.1.20.12
    - 10.1.20.13
  service:
    enabled: true
    port: 2381
    targetPort: 2381

kubeScheduler:
  enabled: true
  endpoints: # ips of servers
    - 10.1.20.11
    - 10.1.20.12
    - 10.1.20.13

kubeProxy:
  enabled: false

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  fullnameOverride: kube-state-metrics
  selfMonitor:
    enabled: true
  prometheus:
    monitor:
      enabled: true
      relabelings:
        - action: replace
          regex: (.*)
          replacement: $1
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: kubernetes_node
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi

nodeExporter:
  enabled: true
  serviceMonitor:
    relabelings:
      - action: replace
        regex: (.*)
        replacement: $1
        sourceLabels:
          - __meta_kubernetes_pod_node_name
        targetLabel: kubernetes_node

prometheus-node-exporter:
  fullnameOverride: node-exporter
  podLabels:
    jobLabel: node-exporter
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
  service:
    portName: http-metrics
  prometheus:
    monitor:
      enabled: true
      relabelings:
        - action: replace
          regex: (.*)
          replacement: $1
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: kubernetes_node
  resources:
    requests:
      cpu: 10m
      memory: 120Mi
    limits:
      memory: 120Mi

prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 100Mi

prometheus:
  enabled: true
  prometheusSpec:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    initContainers:
      - name: fix-permissions
        image: busybox:1.37
        command: ["sh", "-c", "chown -R 1000:1000 /prometheus"]
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
          - name: prometheus-prometheus-prometheus-db
            mountPath: /prometheus
    # Sets the alert generatorURL Alertmanager (and Telegram) links back to;
    # otherwise alerts point at a pod IP that resolves nowhere off-cluster.
    externalUrl: https://prometheus.oliverilp.ee
    replicas: 3
    replicaExternalLabelName: "replica"
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    # Match any ScrapeConfig in the namespace (e.g. proxmox-scrapeconfig.yaml)
    # regardless of labels, mirroring the selectors above. Without this the
    # operator would only pick up ScrapeConfigs carrying the Helm release label.
    scrapeConfigSelectorNilUsesHelmValues: false
    retention: 30d
    retentionSize: "20GB"
    externalLabels:
      tier: main
    enableAdminAPI: true
    walCompression: true
    scrapeInterval: 30s
    evaluationInterval: 30s
    podAntiAffinity: "hard"
    resources:
      requests:
        cpu: 175m
        memory: 2Gi
      limits:
        memory: 7500Mi
    storageSpec:
      disableMountSubPath: true
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 30Gi

thanosRuler:
  enabled: false

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zigbee2mqtt
  namespace: homeassistant
  labels:
    app: zigbee2mqtt
spec:
  serviceName: zigbee2mqtt
  replicas: 1
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      labels:
        app: zigbee2mqtt
      annotations:
        configmap.reloader.stakater.com/reload: "zigbee2mqtt-config"
    spec:
      initContainers:
        - name: config-init
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["sh", "-c"]
          args:
            - |
              # Copy config from ConfigMap to writable location if it doesn't exist
              if [ ! -f /app/data/configuration.yaml ]; then
                cp /tmp/config/configuration.yaml /app/data/configuration.yaml
                echo "Configuration copied from ConfigMap"
              else
                echo "Configuration already exists, skipping copy"
              fi
          volumeMounts:
            - name: zigbee2mqtt-data
              mountPath: /app/data
            - name: zigbee2mqtt-config
              mountPath: /tmp/config
              readOnly: true
      containers:
        - name: zigbee2mqtt
          image: koenkk/zigbee2mqtt:2.14.3@sha256:fb4a6b0f6868ad1cd6a9996479802b2420e599c3463b62bbff8c8cd9a908f43a
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TZ
              value: "Europe/Tallinn"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          resources:
            requests:
              cpu: 10m
              memory: 210Mi
            limits:
              memory: 210Mi
          volumeMounts:
            - name: zigbee2mqtt-data
              mountPath: /app/data
      volumes:
        - name: zigbee2mqtt-data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data-pvc
        - name: zigbee2mqtt-config
          configMap:
            name: zigbee2mqtt-config

# Overrides for the rook-ceph-cluster Helm chart (CephCluster CR).
# Bare-minimum cluster: mons, mgrs, OSDs on the passthrough disk, and the dashboard.
# No CephBlockPool / CephFilesystem / CephObjectStore / StorageClass yet — those are a
# follow-up once the cluster reports HEALTH_OK.

operatorNamespace: rook-ceph

toolbox:
  enabled: true # rook-ceph-tools pod for `ceph status` debugging

monitoring:
  # enabled=true sets spec.monitoring.enabled on the CephCluster: the mgr
  # `prometheus` module (9283) and the ceph-exporter daemons (9926) start
  # reporting, and the Rook operator creates the mgr + exporter ServiceMonitors
  # in this namespace (plus the RBAC to do so). This Prometheus discovers them
  # cluster-wide (serviceMonitorSelectorNilUsesHelmValues: false) — no extra
  # ServiceMonitor/RBAC needed on our side, and rook-ceph has no NetworkPolicy
  # blocking the scrape. Grafana dashboards ship in k8s/monitoring/ceph-dashboards.yaml.
  enabled: true
  # Render the bundled `prometheus-ceph-rules` PrometheusRule (the official Ceph
  # health/OSD/mon/PG/pool-capacity alerts). Picked up via the empty ruleSelector.
  createPrometheusRules: true

cephClusterSpec:
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 3
    allowMultiplePerNode: false
  dashboard:
    enabled: true
    ssl: false
  # Ceph traffic runs over the dedicated 10G storage mesh (Proxmox STP bridge vmbr1,
  # Talos eth1 on 10.1.11.0/24). provider: host puts the daemons in the node netns so
  # they can bind to eth1; addressRanges map directly to Ceph public_network/cluster_network.
  # Migrating an existing cluster requires failing the mons over one at a time (they keep
  # their old network until recreated) — see BOOTSTRAP / the migration runbook.
  network:
    provider: host
    addressRanges:
      public:
        - "10.1.11.0/24"
      cluster:
        - "10.1.11.0/24"
  storage:
    useAllNodes: true
    useAllDevices: false
    deviceFilter: "^sdb$" # only the empty ~761G passthrough disk; never /dev/sda (boot)
  # Note: Rook derives osd_memory_target from the OSD *request* (2Gi), so an OSD normally
  # targets ~2Gi of cache and won't approach its 4Gi limit — the limit is purely a safety
  # ceiling for transient spikes. Other components (prepareosd, crashcollector, exporter,
  # …) keep their small chart defaults.
  resources:
    mon:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        memory: "2Gi"
    mgr:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        memory: "1Gi"
    osd:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        memory: "4Gi"

cephBlockPools:
  - name: ceph-blockpool
    spec:
      failureDomain: host
      replicated:
        size: 3
    storageClass:
      enabled: true
      name: ceph-block
      isDefault: false
      reclaimPolicy: Retain
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      parameters:
        imageFormat: "2"
        imageFeatures: layering
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
        csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/fstype: ext4

cephFileSystems:
  - name: ceph-filesystem
    spec:
      metadataPool:
        replicated:
          size: 3
      dataPools:
        - name: data0
          failureDomain: host
          replicated:
            size: 3
      metadataServer:
        activeCount: 1
        activeStandby: true # 2 MDS pods: 1 active + 1 hot standby (HA)
        resources:
          requests:
            cpu: "250m"
            memory: "1Gi"
          limits:
            memory: "4Gi"
    storageClass:
      enabled: true
      name: ceph-filesystem
      isDefault: false
      reclaimPolicy: Retain
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      parameters:
        fsName: ceph-filesystem
        # Rook names the RADOS data pool <fsName>-<dataPool.name> = ceph-filesystem-data0.
        # This SC `pool` param is the only place it's referenced directly — it must match
        # the generated pool name. PVCs/apps never see it.
        pool: ceph-filesystem-data0
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
        csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"

# Snapshot classes for the two StorageClasses above (chart default is enabled: false).
# The chart derives driver/clusterID/secrets from operatorNamespace and the release
# namespace, so these stay correct if either ever moves.
#
# Requires the CSI snapshot controller + CRDs (k8s/snapshot-controller/) and
# drivers.*.snapshotPolicy: volumeSnapshot (ceph-csi-drivers-values.yaml).
# Consumed by the scheduled snapshots in k8s/volume-snapshots/.
cephBlockPoolsVolumeSnapshotClass:
  enabled: true
  name: ceph-block
  # Every snapshot names its class explicitly; no implicit default.
  isDefault: false
  # Delete, unlike the StorageClass's reclaimPolicy: Retain — scheduled pruning
  # must actually reclaim Ceph space.
  deletionPolicy: Delete
  labels:
    # Lets a future Velero install pick this class for the RBD driver unprompted.
    velero.io/csi-volumesnapshot-class: "true"

cephFileSystemVolumeSnapshotClass:
  enabled: true
  name: ceph-filesystem
  isDefault: false
  deletionPolicy: Delete
  labels:
    velero.io/csi-volumesnapshot-class: "true"

cephObjectStores: []

name: gatus-monitoring

services:
  gatus:
    image: ghcr.io/twin/gatus:stable@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
    restart: unless-stopped
    environment:
      GATUS_CONFIG_PATH: /config
      GATUS_LOG_LEVEL: ${GATUS_LOG_LEVEL:-INFO}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "127.0.0.1:${GATUS_PORT:-8080}:8080"
    volumes:
      - ./config:/config:ro
      - ./data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    restart: unless-stopped
    depends_on:
      - gatus
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}

  watchtower:
    image: containrrr/watchtower:latest@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Tallinn}
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    command:
      - --label-enable
      - --cleanup
      - --schedule
      - ${WATCHTOWER_SCHEDULE:-0 0 4 * * 0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth-es
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-oauth
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Grafana overlays GF_AUTH_GENERIC_OAUTH_* env onto grafana.ini at boot
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ .clientId }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: "d945c8dc-f044-4b57-a94a-b4a801152157"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: clientSecret
      remoteRef:
        key: "32a860f9-1cae-486f-b18b-b4a80115464d"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore

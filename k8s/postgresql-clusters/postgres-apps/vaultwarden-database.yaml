apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: vaultwarden-database
  namespace: postgresql
spec:
  cluster:
    name: postgres-apps
  name: vaultwardendb
  owner: vaultwarden
  databaseReclaimPolicy: retain
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-apps-vaultwarden-auth-es
  namespace: postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: postgres-apps-vaultwarden-auth
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: "7ba7efd4-ca26-4fc9-8297-b32c00d61136"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore
    - secretKey: password
      remoteRef:
        key: "5078cc86-b9a5-40b0-a728-b32c00d63d93"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
        nullBytePolicy: Ignore

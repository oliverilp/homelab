service:
  type: LoadBalancer
  spec:
    loadBalancerIP: 10.1.20.50

providers:
  kubernetesGateway:
    enabled: true

gateway:
  enabled: false

gatewayClass:
  enabled: true
  name: traefik-public

ingressClass:
  enabled: false
  isDefaultClass: false

metrics:
  prometheus:
    enabled: true
    service:
      labels:
        gateway-type: public

deployment:
  replicas: 2
  podLabels:
    gateway-type: public
    traefik-instance: public

resources:
  requests:
    cpu: 50m
    memory: 200Mi
  limits:
    memory: 200Mi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              traefik-instance: public
          topologyKey: kubernetes.io/hostname

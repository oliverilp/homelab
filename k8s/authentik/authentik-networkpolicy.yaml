---
# Default deny all ingress traffic except from same namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: authentik
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# Allow traffic from within the same namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: authentik
spec:
  podSelector: {}
  ingress:
  - from:
    - podSelector: {}

---
# Allow ingress from Traefik (for web access to Authentik)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: authentik
spec:
  podSelector: {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik

---
# Allow health checks from Kubernetes nodes (kubelet) on web port only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-health-checks
  namespace: authentik
spec:
  podSelector: {}
  ingress:
  - from:
    - ipBlock:
        cidr: 10.1.20.0/24  # Kubernetes nodes subnet
    ports:
    - protocol: TCP
      port: 9000  # Authentik web port

---
# Allow ingress from applications that use Authentik for OIDC SSO (HTTPS port only)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-oidc-clients
  namespace: authentik
spec:
  podSelector: {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argocd
    ports:
    - protocol: TCP
      port: 443
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: immich
    ports:
    - protocol: TCP
      port: 443
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: linkwarden
    ports:
    - protocol: TCP
      port: 443
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: memos
    ports:
    - protocol: TCP
      port: 443
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: stump
    ports:
    - protocol: TCP
      port: 443
---
# Allow Dragonfly operator to configure the Authentik Dragonfly pods.
# Port 9999 is the admin port the operator uses for its "is pod in stable
# state" check; without it the operator cannot label pods or set up
# replication, and a rolling update wedges on "found pod without label" with
# the Service (selector role=master) left holding zero endpoints. That is
# exactly what happened on 2026-08-03: Authentik lost its cache entirely and
# crashlooped on 502 liveness probes for three days. Same policy as nextcloud,
# immich and passbolt — authentik was the one instance missing it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dragonfly-operator
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app: authentik-dragonfly
      app.kubernetes.io/name: dragonfly
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dragonfly-operator-system
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 9999

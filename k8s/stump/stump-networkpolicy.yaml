---
# Default deny all ingress traffic except from same namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: stump
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Allow traffic from within the same namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: stump
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector: {}

---
# Allow ingress from Traefik (for web access)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: stump
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik

---
# Allow health checks from Kubernetes nodes (kubelet) on web port only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-health-checks
  namespace: stump
spec:
  podSelector: {}
  ingress:
    - from:
        - ipBlock:
            cidr: 10.1.20.0/24 # Kubernetes nodes subnet
      ports:
        - protocol: TCP
          port: 10801 # Stump web port

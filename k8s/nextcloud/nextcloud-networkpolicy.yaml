---
# Default deny all ingress traffic except from same namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: nextcloud
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# Allow traffic from within the same namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: nextcloud
spec:
  podSelector: {}
  ingress:
  - from:
    - podSelector: {}

---
# Allow ingress from Traefik
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: nextcloud
spec:
  podSelector: {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik

---
# Allow health checks from Kubernetes nodes
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-health-checks
  namespace: nextcloud
spec:
  podSelector: {}
  ingress:
  - from:
    - ipBlock:
        cidr: 10.1.20.0/24
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 9980

---
# Allow Dragonfly operator to configure the Nextcloud Dragonfly pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dragonfly-operator
  namespace: nextcloud
spec:
  podSelector:
    matchLabels:
      app: nextcloud-dragonfly
      app.kubernetes.io/name: dragonfly
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dragonfly-operator-system
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 9999

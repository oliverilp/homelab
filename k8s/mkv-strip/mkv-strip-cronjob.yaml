apiVersion: batch/v1
kind: CronJob
metadata:
  name: mkv-strip
  namespace: mkv-strip
  labels:
    app: mkv-strip
spec:
  schedule: "30 0 * * *"
  timeZone: Europe/Tallinn
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: mkv-strip
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - k8s-worker-01
          automountServiceAccountToken: false
          enableServiceLinks: false
          hostIPC: false
          hostNetwork: false
          hostPID: false
          restartPolicy: Never
          shareProcessNamespace: false
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mkv-strip
              image: ghcr.io/oliverilp/mkv-strip:2026.8.6@sha256:abcf3ee0fbb71d094683a8404dae30621c74e5bc1973781e258a63e64bc5109b
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  value: Europe/Tallinn
                - name: MKV_STRIP_CONFIG
                  value: /etc/mkv-strip/config.json
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                  add:
                    - DAC_OVERRIDE
              volumeMounts:
                - name: config
                  mountPath: /etc/mkv-strip
                  readOnly: true
                - name: media
                  mountPath: /media
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: mkv-strip-config
            - name: media
              persistentVolumeClaim:
                claimName: mkv-strip-media-pvc
            - name: tmp
              emptyDir: {}
